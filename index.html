<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมไพ่สลาฟนับแต้ม (Bridge Slave) Online</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sukhumvit Set', 'Segoe UI', Tahoma, sans-serif; }
        body { background: #1e3c23; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .screen { display: none; height: 100%; width: 100%; }
        .active { display: flex; }

        /* Lobby */
        #lobby-screen { flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #2e5d32, #0f2011); }
        .card-panel { background: rgba(0,0,0,0.6); padding: 30px; border-radius: 16px; width: 360px; text-align: center; border: 1px solid #4a7c4e; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .card-panel h1 { font-size: 24px; margin-bottom: 20px; color: #f39c12; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 14px; margin-bottom: 5px; color: #ccc; }
        .input-group input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #555; background: #222; color: #fff; font-size: 16px; }
        .btn { width: 100%; padding: 12px; margin-top: 8px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #27ae60; color: white; }
        .btn-primary:hover { background: #2ecc71; }
        .btn-secondary { background: #2980b9; color: white; }
        .btn-secondary:hover { background: #3498db; }
        .btn-purple { background: #8e44ad; color: white; }
        .btn-purple:hover { background: #9b59b6; }
        .btn-danger { background: #c0392b; color: white; }
        .btn-danger:hover { background: #e74c3c; }

        /* Game Layout Main Framework */
        #game-screen { flex-direction: row; height: 100vh; background: #1b381e; }
        .main-game-area { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        .top-bar { height: 50px; background: rgba(0,0,0,0.4); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border-bottom: 1px solid #333; }
        .game-table { flex: 1; display: grid; grid-template-rows: 100px 1fr 180px; grid-template-columns: 140px 1fr 140px; position: relative; padding: 10px; }
        
        /* Table Seats */
        .seat { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .seat-top { grid-area: 1 / 2 / 2 / 3; }
        .seat-left { grid-area: 2 / 1 / 3 / 2; }
        .seat-right { grid-area: 2 / 3 / 3 / 4; }
        .seat-bottom { grid-area: 3 / 1 / 4 / 4; }
        
        .player-tag { background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 20px; border: 1px solid #f39c12; font-size: 13px; text-align: center; }
        .player-tag.active-turn { border-color: #00ffcc; box-shadow: 0 0 10px #00ffcc; }
        
        /* Center Felt Table */
        .table-center { grid-area: 2 / 2 / 3 / 3; background: #234727; border-radius: 50%; border: 8px solid #17301a; display: flex; justify-content: center; align-items: center; position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.6); }
        .played-cards-container { position: relative; width: 220px; height: 220px; }
        .played-card-slot { position: absolute; width: 60px; height: 85px; border-radius: 6px; border: 1px dashed rgba(255,255,255,0.2); display: flex; justify-content: center; align-items: center; }
        .slot-top { top: 10px; left: 80px; }
        .slot-bottom { bottom: 10px; left: 80px; }
        .slot-left { top: 67px; left: 10px; }
        .slot-right { top: 67px; right: 10px; }

        /* Card Elements */
        .card { width: 60px; height: 85px; background: white; border-radius: 6px; color: black; display: flex; flex-direction: column; justify-content: space-between; padding: 4px; font-weight: bold; font-size: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); user-select: none; transition: transform 0.2s, top 0.2s; position: relative; cursor: pointer; }
        .card.red { color: #e74c3c; }
        .card.selected { transform: translateY(-15px); border: 2px solid #f1c40f; }
        .card-back { background: linear-gradient(135deg, #b22222, #8b0000); border: 2px solid #fff; }

        /* Hand Area */
        .my-hand { display: flex; justify-content: center; gap: -20px; margin-top: 10px; }
        .my-hand .card { margin-left: -25px; }
        .my-hand .card:first-child { margin-left: 0; }
        .my-hand .card:hover { transform: translateY(-10px); z-index: 100; }

        /* Controls Panel */
        .action-panel { position: absolute; bottom: 200px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); padding: 10px 20px; border-radius: 30px; display: flex; gap: 10px; border: 1px solid #f39c12; z-index: 200; }

        /* Sidebar & Chat Layout */
        .sidebar { width: 300px; background: #142616; border-left: 1px solid #2a4c2d; display: flex; flex-direction: column; }
        .scoreboard { padding: 15px; border-bottom: 1px solid #2a4c2d; background: #0d1a0e; }
        .chat-box { flex: 1; display: flex; flex-direction: column; padding: 10px; }
        .messages { flex: 1; overflow-y: auto; background: #0a120b; border-radius: 8px; padding: 10px; font-size: 13px; margin-bottom: 10px; }
        .msg { margin-bottom: 6px; }
        .msg.sys { color: #f1c40f; font-style: italic; }
        .chat-input { display: flex; gap: 5px; }
        .chat-input input { flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #333; background: #1a2e1c; color: white; }

        /* Modal Overlay */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1e3c23; padding: 25px; border-radius: 12px; border: 2px solid #f39c12; text-align: center; max-width: 400px; }
        
        .score-list { text-align: left; margin: 10px 0; max-height: 120px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; font-size: 12px; }
    </style>
</head>
<body>

    <!-- 1. Lobby Screen -->
    <div id="lobby-screen" class="screen active">
        <div class="card-panel">
            <h1>สลาฟนับแต้ม (Bridge)</h1>
            <div class="input-group">
                <label>ชื่อผู้เล่น:</label>
                <input type="text" id="player-name-input" value="ผู้เล่น 1">
            </div>
            <button class="btn btn-primary" onclick="createRoom()">สร้างห้องใหม่ (Multiplayer)</button>
            <button class="btn btn-purple" onclick="createSinglePlayer()">เล่นกับบอท AI (Single Player)</button>
            <hr style="margin: 15px 0; border-color: #444;">
            <div class="input-group">
                <label>รหัสห้องเพื่อเข้าร่วม:</label>
                <input type="text" id="room-id-input" placeholder="กรอกรหัสห้อง 4 หลัก">
            </div>
            <button class="btn btn-secondary" onclick="joinRoom()">เข้าร่วมห้อง</button>
        </div>
    </div>

    <!-- 2. Main Game Screen -->
    <div id="game-screen" class="screen">
        <div class="main-game-area">
            <div class="top-bar">
                <div>ห้อง: <span id="display-room-id" style="color: #f39c12; font-weight: bold;">-</span></div>
                <div>สถานะ: <span id="display-game-state" style="color: #00ffcc;">กำลังรอผู้เล่น...</span></div>
                <div>ไพ่หลัก (Trump): <span id="display-trump" style="font-size: 18px;">-</span></div>
            </div>

            <div class="game-table">
                <!-- Seat Top (Partner / AI 2) -->
                <div class="seat seat-top">
                    <div id="player-tag-2" class="player-tag">เก้าอี้ว่าง</div>
                </div>

                <!-- Seat Left (Opponent / AI 1) -->
                <div class="seat seat-left">
                    <div id="player-tag-1" class="player-tag">เก้าอี้ว่าง</div>
                </div>

                <!-- Center Felt Table -->
                <div class="table-center">
                    <div class="played-cards-container">
                        <div id="slot-0" class="played-card-slot slot-bottom"></div>
                        <div id="slot-1" class="played-card-slot slot-left"></div>
                        <div id="slot-2" class="played-card-slot slot-top"></div>
                        <div id="slot-3" class="played-card-slot slot-right"></div>
                    </div>
                </div>

                <!-- Seat Right (Opponent / AI 3) -->
                <div class="seat seat-right">
                    <div id="player-tag-3" class="player-tag">เก้าอี้ว่าง</div>
                </div>

                <!-- Seat Bottom (Current Client Player) -->
                <div class="seat seat-bottom">
                    <div id="player-tag-0" class="player-tag" style="margin-bottom: 5px;">เก้าอี้ว่าง</div>
                    <div id="my-hand-container" class="my-hand"></div>
                </div>

                <!-- Action Controls (Floating) -->
                <div id="action-panel" class="action-panel" style="display: none;"></div>
            </div>
        </div>

        <!-- Sidebar (Scoreboard + Chat) -->
        <div class="sidebar">
            <div class="scoreboard">
                <h3 style="color: #f39c12; margin-bottom: 8px;">📊 คะแนนและสถิติ</h3>
                <p>การประมูลสูงสุด: <span id="display-bid" style="color: #00ffcc;">60</span> โดย <span id="display-bidder">-</span></p>
                <hr style="margin: 8px 0; border-color: #2a4c2d;">
                <div>
                    <strong>ทีม A ( seat 0 + 2 ):</strong> <span id="score-team-a" style="color: #f1c40f;">0</span> แต้ม
                    <div class="score-list" id="cards-team-a">ไพ่ที่กินได้: -</div>
                </div>
                <div style="margin-top: 8px;">
                    <strong>ทีม B ( seat 1 + 3 ):</strong> <span id="score-team-b" style="color: #f1c40f;">0</span> แต้ม
                    <div class="score-list" id="cards-team-b">ไพ่ที่กินได้: -</div>
                </div>
                <button id="start-game-btn" class="btn btn-primary" style="margin-top: 10px; display: none;" onclick="requestStartGame()">เริ่มเกม</button>
                <button id="fill-ai-btn" class="btn btn-purple" style="margin-top: 5px; display: none;" onclick="fillAI()">เติม AI ให้เต็ม</button>
            </div>

            <div class="chat-box">
                <div id="messages-container" class="messages"></div>
                <div class="chat-input">
                    <input type="text" id="chat-input-field" placeholder="พิมพ์ข้อความ..." onkeypress="handleChatKeyPress(event)">
                    <button class="btn btn-secondary" style="width: 60px; padding: 0;" onclick="sendChat()">ส่ง</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal ประกาศผลเมื่อจบเกม -->
    <div id="end-modal" class="modal">
        <div class="modal-content">
            <h2 id="end-title" style="color: #f39c12; margin-bottom: 10px;">สรุปผลการแข่งขัน</h2>
            <p id="end-detail" style="margin-bottom: 15px; font-size: 15px;"></p>
            <button class="btn btn-primary" onclick="restartGame()">เล่นใหม่อีกครั้ง</button>
        </div>
    </div>

    <script>
        const socket = io();
        let mySeat = -1;
        let currentRoomId = null;
        let myHandData = [];
        let selectedCardsForDiscard = [];

        // Dynamic Elements
        const lobbyScreen = document.getElementById('lobby-screen');
        const gameScreen = document.getElementById('game-screen');
        const actionPanel = document.getElementById('action-panel');
        const myHandContainer = document.getElementById('my-hand-container');

        function createRoom() {
            const name = document.getElementById('player-name-input').value || 'ผู้เล่น 1';
            socket.emit('createRoom', name);
        }

        function createSinglePlayer() {
            const name = document.getElementById('player-name-input').value || 'ผู้เล่น 1';
            socket.emit('createSinglePlayer', name);
        }

        function joinRoom() {
            const name = document.getElementById('player-name-input').value || 'ผู้เล่น';
            const roomId = document.getElementById('room-id-input').value;
            if (!roomId) return alert('กรุณากรอกรหัสห้อง');
            socket.emit('joinRoom', { roomId, playerName: name });
        }

        socket.on('roomCreated', ({ roomId, seat }) => {
            mySeat = seat;
            currentRoomId = roomId;
            switchToGameScreen(roomId);
        });

        socket.on('joinedSuccess', ({ roomId, seat }) => {
            mySeat = seat;
            currentRoomId = roomId;
            switchToGameScreen(roomId);
        });

        function switchToGameScreen(roomId) {
            lobbyScreen.classList.remove('active');
            gameScreen.classList.add('active');
            document.getElementById('display-room-id').innerText = roomId;
        }

        socket.on('errorMessage', (msg) => alert(msg));

        socket.on('updateRoom', (room) => {
            updateSeatsDisplay(room);
            if (room.seats[0] && room.seats[0].id === socket.id && room.gameState === 'LOBBY') {
                document.getElementById('start-game-btn').style.display = 'block';
                document.getElementById('fill-ai-btn').style.display = 'block';
            } else {
                document.getElementById('start-game-btn').style.display = 'none';
                document.getElementById('fill-ai-btn').style.display = 'none';
            }
        });

        socket.on('yourHand', (hand) => {
            myHandData = hand;
            renderMyHand();
        });

        socket.on('updateGameState', (room) => {
            document.getElementById('display-game-state').innerText = room.gameState;
            document.getElementById('display-bid').innerText = room.highestBid;
            
            let bidderName = room.highestBidder !== -1 ? room.seats[room.highestBidder].name : '-';
            document.getElementById('display-bidder').innerText = bidderName;
            document.getElementById('display-trump').innerText = room.trumpSuit || '-';

            document.getElementById('score-team-a').innerText = room.teamAScore;
            document.getElementById('score-team-b').innerText = room.teamBScore;

            // แสดงรายการไพ่แต้มที่แต่ละทีมกินได้
            document.getElementById('cards-team-a').innerText = 'ไพ่ที่กินได้: ' + (room.teamACapturedCards.map(c => c.suit + c.value).join(', ') || '-');
            document.getElementById('cards-team-b').innerText = 'ไพ่ที่กินได้: ' + (room.teamBCapturedCards.map(c => c.suit + c.value).join(', ') || '-');

            updateSeatsDisplay(room);
            renderPlayedCards(room);
            renderActionControls(room);

            if (room.gameState === 'END') {
                showEndModal(room);
            }
        });

        function updateSeatsDisplay(room) {
            for (let i = 0; i < 4; i++) {
                // คำนวณ UI Index ให้ผู้เล่นปัจจุบันอยู่อย่างถูกต้อง
                let uiIndex = (i - mySeat + 4) % 4;
                let tagElem = document.getElementById(`player-tag-${uiIndex}`);
                let player = room.seats[i];

                if (player) {
                    tagElem.innerText = `${player.name} ${player.isAI ? '🤖' : ''}`;
                    if (room.gameState === 'BIDDING' && room.bidTurn === i) {
                        tagElem.classList.add('active-turn');
                    } else if (room.gameState === 'PLAYING' && getCurrentTurnClient(room) === i) {
                        tagElem.classList.add('active-turn');
                    } else {
                        tagElem.classList.remove('active-turn');
                    }
                } else {
                    tagElem.innerText = `เก้าอี้ว่าง (คลิกเพื่อนั่ง)`;
                    tagElem.onclick = () => socket.emit('changeSeat', { roomId: currentRoomId, targetSeat: i });
                    tagElem.classList.remove('active-turn');
                }
            }
        }

        function getCurrentTurnClient(room) {
            let playedCount = room.currentRoundCards.filter(c => c !== null).length;
            return (room.starterPlayer + playedCount) % 4;
        }

        function renderPlayedCards(room) {
            for (let i = 0; i < 4; i++) {
                let uiIndex = (i - mySeat + 4) % 4;
                let slotElem = document.getElementById(`slot-${uiIndex}`);
                slotElem.innerHTML = '';

                let card = room.currentRoundCards[i];
                if (card) {
                    let cardElem = createCardUI(card);
                    slotElem.appendChild(cardElem);
                }
            }
        }

        function renderMyHand() {
            myHandContainer.innerHTML = '';
            myHandData.forEach((card, index) => {
                let cardElem = createCardUI(card);
                if (selectedCardsForDiscard.includes(index)) {
                    cardElem.classList.add('selected');
                }
                cardElem.onclick = () => onHandCardClick(index);
                myHandContainer.appendChild(cardElem);
            });
        }

        function createCardUI(card) {
            let div = document.createElement('div');
            let isRed = card.suit === '♥️' || card.suit === '♦️';
            div.className = `card ${isRed ? 'red' : ''}`;
            div.innerHTML = `
                <div>${card.value}</div>
                <div style="align-self: center; font-size: 20px;">${card.suit}</div>
                <div style="align-self: flex-end;">${card.value}</div>
            `;
            return div;
        }

        function renderActionControls(room) {
            actionPanel.style.display = 'none';
            actionPanel.innerHTML = '';

            if (room.gameState === 'BIDDING' && room.bidTurn === mySeat) {
                actionPanel.style.display = 'flex';
                let nextBid = room.highestBid + 5;
                actionPanel.innerHTML = `
                    <button class="btn btn-primary" onclick="submitBid(${nextBid}, false)">หมอบเสนอ ${nextBid}</button>
                    <button class="btn btn-danger" onclick="submitBid(0, true)">ผ่าน (Pass)</button>
                `;
            } else if (room.gameState === 'SELECT_TRUMP' && room.dealer === mySeat) {
                actionPanel.style.display = 'flex';
                ['♠', '♥️', '♣', '♦️'].forEach(suit => {
                    let btn = document.createElement('button');
                    btn.className = 'btn btn-secondary';
                    btn.style.padding = '8px 15px';
                    btn.innerText = suit;
                    btn.onclick = () => socket.emit('selectTrump', { roomId: currentRoomId, suit });
                    actionPanel.appendChild(btn);
                });
            } else if (room.gameState === 'KITTY_DISCARD' && room.dealer === mySeat) {
                actionPanel.style.display = 'flex';
                actionPanel.innerHTML = `
                    <button class="btn btn-primary" onclick="confirmDiscard()">ทิ้งไพ่ในมือลง Kitty (${selectedCardsForDiscard.length}/4)</button>
                `;
            }
        }

        function onHandCardClick(index) {
            if (document.getElementById('display-game-state').innerText === 'KITTY_DISCARD') {
                if (selectedCardsForDiscard.includes(index)) {
                    selectedCardsForDiscard = selectedCardsForDiscard.filter(i => i !== index);
                } else if (selectedCardsForDiscard.length < 4) {
                    selectedCardsForDiscard.push(index);
                }
                renderMyHand();
            } else if (document.getElementById('display-game-state').innerText === 'PLAYING') {
                socket.emit('playCard', { roomId: currentRoomId, cardIndex: index });
            }
        }

        function submitBid(bidValue, isPass) {
            socket.emit('submitBid', { roomId: currentRoomId, bidValue, isPass });
        }

        function confirmDiscard() {
            if (selectedCardsForDiscard.length !== 4) {
                return alert('กรุณาเลือกไพ่ให้ครบ 4 ใบเพื่อเก็บลง Kitty');
            }
            socket.emit('confirmDiscard', { roomId: currentRoomId, discardIndexes: selectedCardsForDiscard });
            selectedCardsForDiscard = [];
        }

        function requestStartGame() {
            socket.emit('startGameReq', { roomId: currentRoomId });
        }

        function fillAI() {
            socket.emit('fillAI', { roomId: currentRoomId });
        }

        function restartGame() {
            document.getElementById('end-modal').style.display = 'none';
            socket.emit('restartGameReq', { roomId: currentRoomId });
        }

        function showEndModal(room) {
            let modal = document.getElementById('end-modal');
            let title = document.getElementById('end-title');
            let detail = document.getElementById('end-detail');

            let dealerTeamScore = (room.dealer === 0 || room.dealer === 2) ? room.teamAScore : room.teamBScore;
            let isTargetMet = dealerTeamScore >= room.highestBid;

            if (isTargetMet) {
                title.innerText = '🎉 ฝ่ายเสนอชนะการแข่งขัน!';
                detail.innerText = `ทีมผู้เสนอทำได้ ${dealerTeamScore} แต้ม (เป้าหมาย: ${room.highestBid} แต้ม)`;
            } else {
                title.innerText = '💥 ฝ่ายเสนอแพ้ (ทำแต้มไม่ถึง)!';
                detail.innerText = `ทีมผู้เสนอทำได้เพียง ${dealerTeamScore} แต้ม (เป้าหมาย: ${room.highestBid} แต้ม)`;
            }

            modal.style.display = 'flex';
        }

        // Chat Handlers
        socket.on('newChatMessage', (data) => {
            const container = document.getElementById('messages-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${data.isSystem ? 'sys' : ''}`;
            msgDiv.innerText = `${data.senderName}: ${data.message}`;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        });

        function sendChat() {
            const input = document.getElementById('chat-input-field');
            if (!input.value.trim()) return;
            socket.emit('sendChatMessage', { roomId: currentRoomId, message: input.value });
            input.value = '';
        }

        function handleChatKeyPress(e) {
            if (e.key === 'Enter') sendChat();
        }
    </script>
</body>
</html>
